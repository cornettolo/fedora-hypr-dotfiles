$terminal = kitty
$fileManager = nautilus
$menu = rofi
$menuModeRun = -show drun
$menuModeWindows = -show window
$editor = codium


$mainMod = SUPER

bind = $mainMod, T, exec, $terminal
bind = $mainMod, SPACE, exec, pkill $menu || $menu $menuModeRun
bind = $mainMod, Q, killactive
bind = $mainMod, DELETE, exec, wlogout
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, S, togglesplit,
bind = $mainMod, N, exec, swaync-client -t

bind = $mainMod SHIFT, C, exec, hyprpicker
bind = $mainMod SHIFT, S, exec, hyprshot -m region
bind = $mainMod SHIFT, W, exec, killall waybar; waybar
bind = $mainMod SHIFT, N, exec, codium
bind = $mainMod SHIFT, B, exec, flatpak run com.brave.Browser

# bind = $mainMod, Tab, exec, pkill $menu || ~/.local/bin/hypr/rofi/kindow-switch.sh
bind = $mainMod, Tab, exec, pkill $menu || $menu -show window

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod CTRL, L, workspace, m+1
bind = $mainMod CTRL, H, workspace, m-1

bind = $mainMod CTRL SHIFT, L, workspace, +1
bind = $mainMod CTRL SHIFT, H, workspace, -1

bind = $mainMod CTRL, left, workspace, m-1
bind = $mainMod CTRL, right, workspace, m+1

bind = $mainMod CTRL SHIFT, left, workspace, -1
bind = $mainMod CTRL SHIFT, right, workspace, +1

bind = $mainMod CTRL ALT, L, movetoworkspace, +1
bind = $mainMod CTRL ALT, H, movetoworkspace, -1

bind = $mainMod CTRL ALT, left, movetoworkspace, -1
bind = $mainMod CTRL ALT, right, movetoworkspace, +1

bind = $mainMod CTRL ALT SHIFT, L, movewindow, mon:-1
bind = $mainMod CTRL ALT SHIFT, H, movewindow, mon:+1

bind = $mainMod CTRL ALT SHIFT, left, movewindow, mon:-1
bind = $mainMod CTRL ALT SHIFT, right, movewindow, mon:+1

bind = $mainMod ALT, H, swapwindow, l
bind = $mainMod ALT, L, swapwindow, r
bind = $mainMod ALT, K, swapwindow, u
bind = $mainMod ALT, J, swapwindow, d

bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

bindel = $mainMod SHIFT ALT, H, resizeactive, -16 0
bindel = $mainMod SHIFT ALT, L, resizeactive, 16 0
bindel = $mainMod SHIFT ALT, K, resizeactive, 0 -16
bindel = $mainMod SHIFT ALT, J, resizeactive, 0 16

bindel = $mainMod SHIFT ALT, left, resizeactive, -16 0
bindel = $mainMod SHIFT ALT, right, resizeactive, 16 0
bindel = $mainMod SHIFT ALT, up, resizeactive, 0 -16
bindel = $mainMod SHIFT ALT, down, resizeactive, 0 16

bind = $mainMod, M, togglespecialworkspace, magic
bind = $mainMod CTRL ALT, M, movetoworkspace, special:magic
bind = $mainMod CTRL ALT, N, movetoworkspace, +0

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
