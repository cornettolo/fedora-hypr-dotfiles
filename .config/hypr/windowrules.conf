windowrule = noinitialfocus,class:jetbrains-idea-ce,title:\^win(.\*)
windowrule = nofocus,class:jetbrains-idea-ce,title:\^win(.\*)
windowrule = nofollowmouse,class:jetbrains-idea-ce,title:\^win(.\*)

windowrule = opacity 0.85 0.85 0.95, class:kitty
windowrule = opacity 0.95 0.90 0.95, class:codium
windowrule = opacity 0.95 0.90 0.95, class:jetbrains-idea-ce
windowrule = opacity 0.85 0.80 0.95, class:.*telegram.*
windowrule = opacity 0.85 0.80 0.95, class:.*Ferdium.*
windowrule = opacity 0.85 0.80 0.95, class:slack
