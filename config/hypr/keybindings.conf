$terminal = kitty
$file_manager = nautilus
$menu = rofi
$menu_run = -show drun
$menu_windows = -show window
$editor = codium


$main_mod = SUPER

# simple SUPER + <key>
bind = $main_mod, RETURN, exec, $terminal
bind = $main_mod, SPACE, exec, pkill $menu || $menu $menu_run
bind = $main_mod, Q, killactive
bind = $main_mod, BACKSPACE, exec, $power_menu
bind = $main_mod, V, togglefloating
bind = $main_mod, V, centerwindow
bind = $main_mod, S, togglesplit,
bind = $main_mod, N, exec, swaync-client -t
bind = $main_mod, F, layoutmsg, colresize 1

# pseudo
bind = $main_mod, P, pseudo
bind = $main_mod, P, tagwindow, pseudo

# SUPER + SHIFT + <key>
bindr = $main_mod ALT, Alt_L, exec, true 

bind = $main_mod ALT, I, exec, hyprctl switchxkblayout all next
bind = $main_mod ALT, C, exec, hyprpicker
bind = $main_mod ALT, S, exec, hyprshot -z -m region
bind = $main_mod ALT, W, exec, killall waybar; waybar
bind = $main_mod ALT, N, exec, codium
bind = $main_mod ALT, B, exec, flatpak run com.brave.Browser
bind = $main_mod ALT, V, exec, $clipboard_hist
bind = $main_mod ALT, T, exec, $theme_switch
bind = $main_mod ALT, F, fullscreen,

# window switch SUPER + TAB
bind = $main_mod, Tab, exec, pkill $menu || $menu $menu_windows

# focus move
bind = $main_mod, H, layoutmsg, focus l
bind = $main_mod, L, layoutmsg, focus r
bind = $main_mod, K, layoutmsg, focus u
bind = $main_mod, J, layoutmsg, focus d

bind = $main_mod, left, layoutmsg, focus l
bind = $main_mod, right, layoutmsg, focus r
bind = $main_mod, up, layoutmsg, focus u
bind = $main_mod, down, layoutmsg, focus d

# focus move between monitors
bind = $main_mod, O, focusmonitor, r
bind = $main_mod, I, focusmonitor, l

# change workspace
bindel = $main_mod SHIFT, J, workspace, m+1
bindel = $main_mod SHIFT, K, workspace, m-1

# change/create workspace
bindel = $main_mod SHIFT, up, workspace, -1
bindel = $main_mod SHIFT, down, workspace, +1

# move to existing workspace
bindel = $main_mod SHIFT ALT, J, movetoworkspace, m+1
bindel = $main_mod SHIFT ALT, K, movetoworkspace, m-1

# move to existing/new workspace
bindel = $main_mod SHIFT ALT, up, movetoworkspace, -1
bindel = $main_mod SHIFT ALT, down, movetoworkspace, +1

# move to other monitor workspace
bind = $main_mod SHIFT ALT, O, movewindow, mon:+1
bind = $main_mod SHIFT ALT, I, movewindow, mon:-1

# swap windows with <direction>
# bind = $main_mod ALT, H, swapwindow, l
# bind = $main_mod ALT, L, swapwindow, r
# bind = $main_mod ALT, K, swapwindow, u
# bind = $main_mod ALT, J, swapwindow, d
#
# bind = $main_mod ALT, left, swapwindow, l
# bind = $main_mod ALT, right, swapwindow, r
# bind = $main_mod ALT, up, swapwindow, u
# bind = $main_mod ALT, down, swapwindow, d

# Move windows within the strip (Niri style)
bind = $main_mod SHIFT, H, layoutmsg, movewindowto l
bind = $main_mod SHIFT, L, layoutmsg, movewindowto r

bind = $main_mod SHIFT, left, layoutmsg, movewindowto l
bind = $main_mod SHIFT, right, layoutmsg, movewindowto r

# use Mouse Scroll to move through the strip
bind = $main_mod, mouse_down, layoutmsg, focus r
bind = $main_mod, mouse_up, layoutmsg, focus l

# also for workspaces in monitor
bind = $main_mod SHIFT, mouse_down, workspace, m+1
bind = $main_mod SHIFT, mouse_up, workspace, m-1

# resize active window
bindel = $main_mod CTRL, H, resizeactive, -12 0
bindel = $main_mod CTRL, H, moveactive, 6 0
bindel = $main_mod CTRL, L, resizeactive, 12 0
bindel = $main_mod CTRL, L, moveactive, -6 0
bindel = $main_mod CTRL, K, resizeactive, 0 -12
bindel = $main_mod CTRL, K, moveactive, 0 6
bindel = $main_mod CTRL, J, resizeactive, 0 12
bindel = $main_mod CTRL, J, moveactive, 0 -6

bindel = $main_mod CTRL, left, resizeactive, -12 0
bindel = $main_mod CTRL, left, moveactive, 6 0
bindel = $main_mod CTRL, right, resizeactive, 12 0
bindel = $main_mod CTRL, right, moveactive, -6 0
bindel = $main_mod CTRL, up, resizeactive, 0 -12
bindel = $main_mod CTRL, up, moveactive, 0 6
bindel = $main_mod CTRL, down, resizeactive, 0 12
bindel = $main_mod CTRL, down, moveactive, 0 -6

# column resize
bindel = $main_mod CTRL, H, layoutmsg, colresize -conf
bindel = $main_mod CTRL, L, layoutmsg, colresize +conf

bindel = $main_mod CTRL, left, layoutmsg, colresize -conf
bindel = $main_mod CTRL, right, layoutmsg, colresize +conf

# magic workspace
bind = $main_mod, M, togglespecialworkspace, magic
bind = $main_mod SHIFT ALT, M, movetoworkspace, special:magic
bind = $main_mod SHIFT ALT, N, movetoworkspace, +0

bindm = $main_mod, mouse:272, movewindow
bindm = $main_mod, mouse:273, resizewindow

# media keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
