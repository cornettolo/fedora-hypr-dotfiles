$font = DroidSansM Nerd Font Mono 
# $font = CaskaydiaMonoNF
# $font = DepartureMono Nerd Font
# $font = GohuFont 11 Nerd Font Mono
$accent = rgba(458588FF)
$light = rgb(FBF1C7)

general {
    hide_cursor = true
}

# uncomment to enable fingerprint authentication
auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250 # in milliseconds
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/theme/wallpaper1
    blur_passes = 2
    blur_size = 1
}


input-field {
    monitor = DP-1
    size = 200, 200
    outline_thickness = 24
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    font_family = $font

    outer_color = rgba(FBF1C722)
    check_color = rgba(689D6AEE)
    fail_color = rgba(CC241DEE)

    font_color = rgb(FBF1C7)
    fade_on_empty = false
    fade_timeout = 1000

    rounding = 145

    placeholder_text =
    fail_text = 

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    hide_input = true

    position = 0, -40
    halign = center
    valign = center
}

# TIME
label {
    monitor = DP-1
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font
    color = rgb(FBF1C7)

    position = 0, -150
    halign = center
    valign = top
}

# DATE
label {
    monitor = DP-1
    color = $accent
    text = cmd[update:10000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = 0, -300
    halign = center
    valign = top
}
